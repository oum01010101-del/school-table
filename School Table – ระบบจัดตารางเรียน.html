<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>School Table – ระบบจัดตารางเรียน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffbe8;--card:#fff;--ink:#2b2b2b;--hd:#ffd966;--cell:#fff2cc;--ok:#b7e1cd;--bad:#f4c7c3;--line:#d8c47a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1f1d16;--card:#2a2719;--ink:#f1ead2;--hd:#7a6420;--cell:#3a3420;--ok:#2f5a47;--bad:#7a3b36;--line:#6b5d2e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1f1d16;--card:#2a2719;--ink:#f1ead2;--hd:#7a6420;--cell:#3a3420;--ok:#2f5a47;--bad:#7a3b36;--line:#6b5d2e}
html,body{height:auto}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Sarabun,'TH Sarabun New','TH SarabunPSK',sans-serif}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;overflow-x:auto;background:var(--hd);padding:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:6}
button,select,input,textarea{font:inherit;color:inherit}
nav button,.tabs button{border:0;border-radius:6px;padding:5px 11px;background:var(--card);cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on,.tabs button.on{outline:3px solid var(--ink)}
main{padding:10px;max-width:100%}h3{margin:14px 0 6px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:2px 4px;min-width:0;width:100%;box-sizing:border-box}
.g{border-collapse:collapse;background:var(--card)}.g td,.g th{border:1px solid var(--line);padding:2px 4px;text-align:center}.g th{background:var(--hd)}.g td:first-child{white-space:nowrap}
.sw{overflow-x:auto;max-width:100%}.nt{opacity:.75;margin:4px 0}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.bar select{width:auto}
.sc td{min-width:122px;vertical-align:top;font-size:13px}.sc td.on{background:var(--ok)}.sc td.em{background:var(--cell)}.sc th:first-child,.sc td:first-child{position:sticky;left:0}
.bad,tr.bad td{background:var(--bad)}tr.ok td{background:var(--ok)}.sm{width:42px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.cards{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.hero{background:#fcf3cf;border-radius:18px;padding:22px;text-align:center;color:#2b2b2b;border-bottom:10px solid #b06a43}.hero h1{margin:0;font-size:26px}.hero h2{margin:4px 0 14px;font-size:56px;letter-spacing:3px}
.dy{display:flex;gap:4px;flex-wrap:wrap}.dy span{flex:1;min-width:80px;padding:10px 0;color:#fff;font-weight:700}
.f td{padding:2px 6px 2px 0}.f td:first-child{white-space:nowrap}.lk{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
.sheet{background:#fffbe8;color:#2b2b2b;padding:12px;border:1px solid var(--line);overflow-x:auto}.ph{display:flex;align-items:center;gap:14px;justify-content:center}.ph img{height:64px}.ph h2{margin:0;text-align:center}
.pt{border-collapse:collapse;width:100%;font-size:15px}.pt td,.pt th{border:1px solid #333;padding:3px;text-align:center;min-width:80px}.pt select{background:transparent;border:0;text-align:center;font-weight:600}.pt hr{border:0;border-top:1px dashed #999;margin:3px 0}
.sg{display:flex;justify-content:space-around;margin-top:26px;text-align:center;white-space:pre-line}#st{position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:12px;font-size:12px}
@media print{@page{size:A4 landscape;margin:8mm}body{background:#fff}nav,.noprint,#st,body::before{display:none!important}main{padding:0}.sheet{border:0;padding:0}.pt select{appearance:none}}
</style></head><body>
<nav id="nav"></nav><main id="app"></main><div id="st"></div>
<script>
const K='schooltable.v1',DN=['จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'],
DC=[['#ffe599','#fff2cc'],['#ead1dc','#f8e0f4'],['#b6d7a8','#d9ead3'],['#f9cb9c','#fce5cd'],['#a4c2f4','#c9daf8'],['#d5a6bd','#ead1dc'],['#ea9999','#f4cccc']],
HC=['#3f82a3','#f48b67','#f7b85f','#ef6666','#d4c945','#a5468b'],
P0=[['Homeroom','08.30','08.40'],['1','08.40','09.40'],['2','09.40','10.40'],['พัก','10.40','10.50'],['3','10.50','11.50'],['พักกลางวัน','11.50','13.00'],['4','13.00','14.00'],['5','14.00','15.00']],
SG=['ภาษาไทย','คณิตศาสตร์','วิทยาศาสตร์ฯ','สังคมศึกษาฯ','ประวัติศาสตร์','สุขศึกษาฯ','ศิลปะ','การงานอาชีพ','ภาษาอังกฤษ','','เพิ่มเติม 1','เพิ่มเติม 2'],
TABS=[['home','หน้าหลัก'],['set','1-2 ตั้งค่าและห้อง'],['tch','3 ครู/ชั้นเรียน'],['sub','4 รายวิชา'],['rem','วิชาคงเหลือ'],['sch','5 ลงตาราง'],['pc','ตารางเรียนรายชั้น'],['pt','ตารางสอนครู'],['pr','ตารางการใช้ห้อง'],['data','สำรองข้อมูล']];
const def=()=>({cfg:{school:'โรงเรียนตลาดนัดต้นมะขาม',dir:'นางสาวตูแวซาลีนี  นิเซง',dirPos:'ผู้อำนวยการโรงเรียนตลาดนัดต้นมะขาม',head:'นายอับดุลรอฮิม   สาเม๊าะ',headPos:'หัวหน้าบริหารงานวิชาการ',year:2563,unit:'คาบ',nc:10,np:8,open:[1,1,1,1,1,0,0],logo:''},
per:Array.from({length:20},(_,i)=>{const p=P0[i]||['','',''];return{n:p[0],a:p[1],b:p[2]}}),
rooms:['ห้องวิทยาศาสตร์','ห้องป.1','ห้องป.2','ห้องสภานักเรียน','ห้องการศึกษาพิเศษ','ห้องประชุม','ห้องสมุด','ห้องอ.2','ห้องอ.3','ห้องป.5','ห้องศิลปะ','ห้องป.3','ห้องป.4','ห้องป.6','สนามกีฬา'].concat(Array(135).fill('')),
cls:['ป.1/1','ป.1/2','ป.2/1','ป.2/2','ป.3/1','ป.3/2','ป.4/1','ป.4/2','ป.5','ป.6'].concat(Array(90).fill('')),
t:Array.from({length:200},()=>({n:'',c:{}})),g:Array.from({length:20},(_,i)=>({n:i<6?'ครูป.'+(i+1):'',m:{}})),s:{},sc:{},pv:{c:'',t:'',r:'',cols:{}}});
function load(){const d=def();try{const j=JSON.parse(localStorage.getItem(K)||'null');if(j){Object.assign(d.cfg,j.cfg);for(const k of['per','rooms','cls','t','g','s','sc','pv'])if(j[k])d[k]=j[k]}}catch(x){}return d}
let S=load(),tab='home',day=0,cs=0,gi=0,rst=0;
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));$('#st').textContent='บันทึกอัตโนมัติแล้ว '+new Date().toLocaleTimeString('th-TH')}catch(x){$('#st').textContent='⚠ บันทึกไม่สำเร็จ (พื้นที่เต็มหรือถูกบล็อก)'}};
const O=(a,v,b=1)=>{a=a.filter(Boolean);if(v&&!a.includes(v))a=[...a,v];return(b?'<option></option>':'')+a.map(x=>`<option${x==v?' selected':''}>${E(x)}</option>`).join('')};
const I=(p,v,x='')=>`<input data-p="${p}" value="${E(v)}" ${x}>`,SL=(p,a,v,x='',b=1)=>`<select data-p="${p}" ${x}>${O(a,v,b)}</select>`;
function set(p,v){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]]??={};o[k[k.length-1]]=v}
const nc=()=>Math.max(0,Math.min(100,+S.cfg.nc||0)),U=()=>S.cfg.unit,PN=()=>S.per.slice(0,Math.max(0,Math.min(20,+S.cfg.np||0))),cn=i=>S.cls[i]||'',
sr=c=>Object.values(S.s[c]||{}).filter(x=>x&&x.n),sub=(c,n)=>sr(c).find(x=>x.n==n),
use=(c,n)=>{let k=0;for(const d in S.sc)for(const p in S.sc[d][c]||{})if(S.sc[d][c][p]==n)k++;return k},
tl=c=>S.t.filter(t=>t.n&&t.c[c]=='/').map(t=>t.n).concat(S.g.filter(g=>g.n).map(g=>g.n)),
mine=(x,n)=>[x.t1,x.t2].some(t=>t&&(t==n||S.g.some(g=>g.n==t&&Object.values(g.m).includes(n)))),
hrs=(n,c)=>sr(c).reduce((a,x)=>a+(mine(x,n)?+x.h||0:0),0);
function cf(d){const T={},R={},D=S.sc[d]||{};for(const c in D)for(const p in D[c]){const x=sub(+c,D[c][p]);if(!x)continue;for(const t of[x.t1,x.t2])if(t)T[p+t]=(T[p+t]||0)+1;if(x.r)R[p+x.r]=(R[p+x.r]||0)+1}return{T,R}}
const F=['บริหารจัดการตารางสอนและตารางเรียนในโรงเรียนได้โดยง่าย','ข้อมูลบันทึกอัตโนมัติในเบราว์เซอร์ (LocalStorage) ปิดแล้วเปิดใหม่ข้อมูลยังอยู่ครบ','เพิ่มจำนวนครูผู้สอนในแต่ละวิชาได้ไม่เกิน 2 คน และจัดกลุ่มครูผู้สอนได้ไม่เกิน 20 กลุ่ม กลุ่มละไม่เกิน 50 คน','เพิ่มครูผู้สอนได้ไม่เกิน 200 คน / ห้องเรียนไม่เกิน 100 ห้อง / ห้องที่ใช้เรียนไม่เกิน 150 ห้อง','เพิ่มจำนวนคาบในแต่ละวันได้ไม่เกิน 20 คาบ (รวมคาบพิเศษ)','จัดตารางได้ทั้ง 7 วันของสัปดาห์','เตือนสีแดงเมื่อครูผู้สอนหรือห้องที่ใช้เรียนซ้ำในช่วงเวลาเดียวกัน','ใส่โลโก้โรงเรียนได้','พิมพ์ “ตารางเรียนรายชั้นเรียน” “ตารางสอนครูผู้สอน” “ตารางการใช้ห้องเรียน”'],
ST=[['set','1. กรอกข้อมูลทั่วไป (จำเป็น)'],['set','2. กรอกข้อมูลห้องที่ใช้เรียน/สถานที่เรียน'],['tch','3. กรอกข้อมูลครูผู้สอนและข้อมูลห้องเรียน'],['sub','4. กรอกข้อมูลรายวิชา'],['sch','5. ลงรายวิชาตาราง'],['pc','6. ปริ้นตาราง']];
const vHome=()=>`<div class=hero><h1>โปรแกรมช่วยจัดการตารางสอนออนไลน์</h1><h2>School Table</h2><div class=dy>${DN.slice(0,6).map((d,i)=>`<span style="background:${HC[i]}">${d}</span>`).join('')}</div></div><div class=cols><div><h3>ฟังก์ชันการทำงาน</h3><ol>${F.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>แค่ 6 ขั้นตอนแสนง่าย !</h3><ol style="list-style:none;padding:0">${ST.map(s=>`<li><button class=lk data-t=${s[0]}>${s[1]}</button></li>`).join('')}</ol><p>กรอกได้เฉพาะช่องสีขาว · ครู/ห้องที่ชนกันจะขึ้นเป็นสีแดง · ควรสำรองข้อมูลเป็นระยะที่แท็บ “สำรองข้อมูล”</p></div></div>`;
function vSet(){const c=S.cfg;return`<div class=cols><div><h3>1. กรอกข้อมูลทั่วไป</h3><table class=f>${[['school','ชื่อโรงเรียน'],['dir','ชื่อผู้บริหารโรงเรียน'],['dirPos','ตำแหน่ง'],['head','หัวหน้าบริหารงานวิชาการ/ผู้จัดตารางสอน'],['headPos','ตำแหน่ง'],['year','ปีการศึกษา']].map(([k,l])=>`<tr><td>${l}</td><td>${I('cfg.'+k,c[k])}</td></tr>`).join('')}<tr><td>จำนวนห้องเรียนที่ใช้สร้างตาราง (สูงสุด 100)</td><td>${I('cfg.nc',c.nc,'type=number min=1 max=100 data-n=1')}</td></tr><tr><td>ใช้คำว่า</td><td>${SL('cfg.unit',['คาบ','ชั่วโมง'],c.unit,'',0)}</td></tr><tr><td>โลโก้โรงเรียน</td><td><input type=file accept="image/*" id=lg>${c.logo?`<img src="${c.logo}" height=40>`:''}</td></tr><tr><td>จำนวน${U()}ทั้งหมดต่อวัน (สูงสุด 20)</td><td>${I('cfg.np',c.np,'type=number min=1 max=20 data-n=1')}</td></tr></table><h3>วันที่เปิดเรียน</h3>${DN.map((d,i)=>`<label style="margin-right:10px"><input type=checkbox style="width:auto" data-p="cfg.open.${i}" ${c.open[i]?'checked':''}> ${d}</label>`).join('')}<p class=nt>เปิดเรียนทั้งหมด ${c.open.filter(Boolean).length} วันต่อสัปดาห์</p></div><div><h3>เวลาแต่ละ${U()}</h3><p class=nt>ข้อมูลนี้ใช้คำนวณและแสดงบนตารางเรียนรายชั้น/ตารางสอนครู · ถ้าไม่มี${U()}เรียนให้เว้นไว้</p><table class=g><tr><th>${U()}ที่</th><th>ชื่อ/เลขคาบ</th><th>ตั้งแต่</th><th>ถึง</th></tr>${S.per.map((p,i)=>`<tr style="opacity:${i<PN().length?1:.45}"><td>${i+1}</td><td>${I(`per.${i}.n`,p.n)}</td><td>${I(`per.${i}.a`,p.a)}</td><td>${I(`per.${i}.b`,p.b)}</td></tr>`).join('')}</table></div></div><h3>2. ห้องที่ใช้เรียน/สถานที่เรียน (สูงสุด 150 ห้อง)</h3><div class=cols style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${[0,1,2].map(k=>`<div>${S.rooms.slice(k*50,k*50+50).map((r,i)=>`<div style="display:flex;gap:4px;margin-bottom:2px"><span style="width:2.2em">${k*50+i+1}</span>${I('rooms.'+(k*50+i),r,`placeholder="ห้องเรียนที่ ${k*50+i+1}"`)}</div>`).join('')}</div>`).join('')}</div>`}
function vTeach(){const n=nc();let h=`<p class=nt>พิมพ์ชื่อครู แล้วเลือก “/” ในช่องชั้นเรียนที่สอน (X = ไม่สอน) · ตัวเลขใต้ช่อง = จำนวน${U()}ที่นับจากรายวิชา</p><div class=sw><table class=g><tr><th>#</th><th>ชื่อครูผู้สอน</th><th>รวม${U()}</th>${S.cls.slice(0,n).map((x,i)=>`<th>${I('cls.'+i,x,'style="width:72px"')}</th>`).join('')}</tr>`;
S.t.forEach((t,i)=>{let tot=0;const cells=S.cls.slice(0,n).map((_,c)=>{const v=t.c[c]||'',k=v=='/'&&t.n?hrs(t.n,c):0;tot+=k;return`<td>${SL(`t.${i}.c.${c}`,['/','X'],v,'class=sm')}${k?`<br><b>${k}</b>`:''}</td>`}).join('');h+=`<tr><td>${i+1}</td><td>${I(`t.${i}.n`,t.n)}</td><td>${t.n?tot:''}</td>${cells}</tr>`});
const g=S.g[gi],cnt={};S.g.forEach(x=>Object.values(x.m).forEach(m=>m&&(cnt[m]=(cnt[m]||0)+1)));
return h+`</table></div><datalist id=tn>${S.t.filter(t=>t.n).map(t=>`<option>${E(t.n)}</option>`).join('')}</datalist><h3>กลุ่มครูผู้สอน (กลุ่มละไม่เกิน 50 คน · ครู 1 คนควรอยู่เพียง 1 กลุ่ม ถ้าซ้ำจะเป็นสีแดง)</h3><div class=bar>กลุ่ม <select data-gi>${S.g.map((x,i)=>`<option value=${i}${i==gi?' selected':''}>${i+1}. ${E(x.n)}</option>`).join('')}</select> ชื่อกลุ่ม <input data-p="g.${gi}.n" value="${E(g.n)}" style="width:200px"></div><div class=cols style="grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:3px">${Array.from({length:50},(_,i)=>`<input list=tn data-p="g.${gi}.m.${i}" value="${E(g.m[i])}" class="${g.m[i]&&cnt[g.m[i]]>1?'bad':''}" placeholder="สมาชิก ${i+1}">`).join('')}</div>`}
function vSubj(){const c=cs,r=S.s[c]||{},tt=tl(c),tot=sr(c).reduce((a,x)=>a+(+x.h||0),0);
let h=`<div class=bar>ชั้นเรียน <select data-cs>${S.cls.slice(0,nc()).map((x,i)=>`<option value=${i}${i==c?' selected':''}>${E(x)}</option>`).join('')}</select> รวม <b>${tot}</b> ${U()} <span class=nt>พิมพ์ชื่อวิชา เลือกครู เลือกห้อง และกรอกจำนวน${U()}เป็นจำนวนนับ · ครูเลือกได้เฉพาะที่ติ๊ก “/” ในชั้นนี้ และชื่อกลุ่มครู</span></div><div class=sw><table class=g><tr><th>#</th><th>ชื่อวิชา</th><th>ครูคนที่ 1</th><th>ครูคนที่ 2</th><th>ห้อง</th><th>จำนวน${U()}</th></tr>`;
for(let i=0;i<34;i++){const x=r[i]||{},p=`s.${c}.${i}.`;h+=`<tr><td>${i+1}</td><td>${I(p+'n',x.n,`placeholder="${E(SG[i]||'')}"`)}</td><td>${SL(p+'t1',tt,x.t1)}</td><td>${SL(p+'t2',tt,x.t2)}</td><td>${SL(p+'r',S.rooms,x.r)}</td><td>${I(p+'h',x.h,'type=number min=0 data-n=1 style="width:72px"')}</td></tr>`}return h+'</table></div>'}
function vRem(){let h=`<p class=nt>คงเหลือ = จำนวน${U()}ในรายวิชา − ที่ลงตารางแล้ว · เขียว = ครบแล้ว · แดง = ลงเกิน</p><div class=cards>`;for(let c=0;c<nc();c++){h+=`<table class="g"><tr><th colspan=4>${E(cn(c))}</th></tr><tr><th>รายวิชา</th><th>จำนวน</th><th>ลงแล้ว</th><th>คงเหลือ</th></tr>${sr(c).map(x=>{const u=use(c,x.n),m=(+x.h||0)-u;return`<tr class="${m<0?'bad':m==0?'ok':''}"><td>${E(x.n)}</td><td>${+x.h||0}</td><td>${u}</td><td>${m}</td></tr>`}).join('')||'<tr><td colspan=4>ยังไม่มีรายวิชา</td></tr>'}</table>`}return h+'</div>'}
